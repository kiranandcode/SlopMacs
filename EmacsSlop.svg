<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" viewBox="0 0 800 320" height="320" width="800">
  <defs>
    <!-- Background gradient - vaporwave sunset -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0221;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#1a0533;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a2e;stop-opacity:1"/>
    </linearGradient>

    <!-- Neon pink glow for icon circle -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" style="stop-color:#ff006e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0.4"/>
    </radialGradient>

    <!-- Icon circle gradient - hot pink to electric purple -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8338ec;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a86ff;stop-opacity:1"/>
    </linearGradient>

    <!-- Icon circle stroke - neon -->
    <linearGradient id="circleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:1"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff006e"/>
      <stop offset="35%" style="stop-color:#ff006e"/>
      <stop offset="55%" style="stop-color:#8338ec"/>
      <stop offset="100%" style="stop-color:#3a86ff"/>
    </linearGradient>

    <!-- Slop text gradient - toxic green to yellow -->
    <linearGradient id="slopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39ff14"/>
      <stop offset="50%" style="stop-color:#00ff87"/>
      <stop offset="100%" style="stop-color:#00f5d4"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0.15)"/>
    </pattern>

    <!-- Grid pattern for background -->
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(138,43,226,0.08)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bgGrad)" rx="16"/>

  <!-- Perspective grid (vaporwave floor) -->
  <rect width="800" height="320" fill="url(#grid)"/>

  <!-- Decorative horizontal lines -->
  <line x1="0" y1="310" x2="800" y2="310" stroke="#ff006e" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="10" x2="800" y2="10" stroke="#3a86ff" stroke-width="0.5" opacity="0.3"/>

  <!-- === ICON (left side) === -->
  <g transform="translate(60, 30)">
    <!-- Outer glow ring -->
    <circle cx="130" cy="130" r="140" fill="url(#iconGlow)" filter="url(#heavyGlow)"/>

    <!-- Main circle -->
    <circle cx="130" cy="130" r="118" fill="url(#circleGrad)" stroke="url(#circleStroke)" stroke-width="5"/>

    <!-- GNU quill path (simplified & scaled from original) -->
    <g transform="translate(-4, -4) scale(0.505)">
      <path d="M 175,422 c 0,0 19.7,1.4 45.1,-0.8 10.3,-0.9 49.3,-4.7 78.5,-11.1 0,0 35.6,-7.6 54.6,-14.6 19.9,-7.3 30.8,-13.6 35.6,-22.4 -0.2,-1.8 1.5,-8.2 -7.7,-12.1 -23.5,-9.9 -50.7,-8.1 -104.6,-9.2 -59.8,-2.1 -79.7,-12.1 -90.3,-20.1 -10.2,-8.2 -5,-30.8 38.5,-50.7 21.9,-10.6 107.9,-30.2 107.9,-30.2 -28.9,-14.3 -82.9,-39.5 -94,-44.9 -9.7,-4.8 -25.3,-11.9 -28.7,-20.6 -3.8,-8.3 9,-15.5 16.2,-17.6 23.1,-6.7 55.8,-10.8 85.6,-11.3 14.9,-0.2 17.4,-1.2 17.4,-1.2 20.6,-3.4 34.2,-17.5 28.5,-39.9 -5.1,-22.8 -31.9,-36.2 -57.3,-31.6 -24,4.4 -81.7,21.2 -81.7,21.2 71.4,-0.6 83.4,0.6 88.7,8 3.2,4.4 -1.4,10.5 -20.5,13.6 -20.7,3.4 -63.8,7.5 -63.8,7.5 -41.3,2.5 -70.5,2.6 -79.2,21.1 -5.7,12.1 6.1,22.8 11.3,29.4 21.8,24.3 53.4,37.4 73.7,47 7.6,3.6 30.1,10.5 30.1,10.5 -65.9,-3.6 -113.4,16.6 -141.3,39.9 -31.5,29.2 -17.6,63.9 47,85.3 38.2,12.6 57.1,18.6 114,13.5 33.5,-1.8 38.8,-0.7 39.1,2 0.5,3.9 -37.2,13.5 -47.5,16.5 -26.2,7.6 -94.8,22.8 -95.2,22.9 z"
        fill="#ffffff" fill-opacity="0.95" filter="url(#subtleGlow)"/>
    </g>

    <!-- Scanline overlay on icon -->
    <circle cx="130" cy="130" r="118" fill="url(#scanlines)" opacity="0.3"/>
  </g>

  <!-- === TEXT (right side) === -->
  <g transform="translate(340, 0)">
    <!-- "Emacs" -->
    <text x="0" y="128" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace" font-size="82" font-weight="900" fill="url(#textGrad)" filter="url(#textGlow)" letter-spacing="-2">
      Emacs
    </text>

    <!-- "Slop" with toxic glow -->
    <text x="5" y="200" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace" font-size="78" font-weight="900" fill="url(#slopGrad)" filter="url(#neonGlow)" letter-spacing="-1">
      Slop
    </text>

    <!-- Tagline -->
    <text x="8" y="245" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace" font-size="15" fill="#8b8ba7" letter-spacing="4" font-weight="400">
      AI-REWRITTEN INTERNALS
    </text>

    <!-- Version badge -->
    <g transform="translate(8, 260)">
      <rect width="90" height="24" rx="4" fill="rgba(255,0,110,0.15)" stroke="#ff006e" stroke-width="0.8"/>
      <text x="45" y="16" font-family="'SF Mono', monospace" font-size="11" fill="#ff006e" text-anchor="middle" font-weight="600">v31.0.50</text>
    </g>
    <g transform="translate(108, 260)">
      <rect width="105" height="24" rx="4" fill="rgba(57,255,20,0.1)" stroke="#39ff14" stroke-width="0.8"/>
      <text x="52" y="16" font-family="'SF Mono', monospace" font-size="11" fill="#39ff14" text-anchor="middle" font-weight="600">web-display</text>
    </g>
    <g transform="translate(223, 260)">
      <rect width="72" height="24" rx="4" fill="rgba(58,134,255,0.1)" stroke="#3a86ff" stroke-width="0.8"/>
      <text x="36" y="16" font-family="'SF Mono', monospace" font-size="11" fill="#3a86ff" text-anchor="middle" font-weight="600">claude</text>
    </g>
  </g>

  <!-- Scanline overlay on everything -->
  <rect width="800" height="320" fill="url(#scanlines)" opacity="0.1" rx="16"/>
</svg>
