<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="-40 -70 592 650" height="650" width="592">
  <defs>
    <!-- Original Emacs circle gradient: lavender -> purple -> magenta -->
    <linearGradient id="emacsCircle" x1="-122" y1="-162" x2="237" y2="301" gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(0.87,0,0,0.83,246,250)">
      <stop offset="0%" style="stop-color:#8381c5"/>
      <stop offset="56%" style="stop-color:#7e55b3"/>
      <stop offset="100%" style="stop-color:#a52ecb"/>
    </linearGradient>

    <!-- Original Emacs stroke: dark purple -->
    <linearGradient id="emacsStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#411f5d"/>
      <stop offset="100%" style="stop-color:#5b2a85"/>
    </linearGradient>

    <!-- Ear inner (lighter purple/pink) -->
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bab8db"/>
      <stop offset="100%" style="stop-color:#8381c5"/>
    </linearGradient>

    <!-- Claude gradient -->
    <radialGradient id="claudeGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#e8956a"/>
      <stop offset="100%" style="stop-color:#cc7755"/>
    </radialGradient>

    <!-- Drip gradients in Emacs purples -->
    <linearGradient id="dripPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7e55b3"/>
      <stop offset="100%" style="stop-color:#7e55b3;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dripLavender" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bab8db"/>
      <stop offset="100%" style="stop-color:#bab8db;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dripMagenta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a52ecb"/>
      <stop offset="100%" style="stop-color:#a52ecb;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dripDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5b2a85"/>
      <stop offset="100%" style="stop-color:#5b2a85;stop-opacity:0"/>
    </linearGradient>

    <!-- Melting warp -->
    <filter id="meltWarp" x="-5%" y="-5%" width="110%" height="115%">
      <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" seed="3" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Quill warp (melting distortion + soft glow) -->
    <filter id="quillWarp" x="-8%" y="-8%" width="116%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" seed="7" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="12" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="warped"/>
      </feMerge>
    </filter>

    <!-- Shadow blur -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle glow -->
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circle warp (subtle, not perfectly round) -->
    <filter id="circleWarp" x="-5%" y="-5%" width="110%" height="115%">
      <feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="2" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>

    <!-- Quill path -->
    <path id="quill" d="m 175,422.3 c 0,0 19.7,1.4 45.1,-0.8 10.3,-0.9 49.3,-4.7 78.5,-11.1 0,0 35.6,-7.6 54.6,-14.6 19.9,-7.3 30.8,-13.6 35.6,-22.4 -0.2,-1.8 1.5,-8.2 -7.7,-12.1 -23.5,-9.9 -50.7,-8.1 -104.6,-9.2 -59.8,-2.1 -79.7,-12.1 -90.3,-20.1 -10.2,-8.2 -5.1,-30.8 38.5,-50.7 21.9,-10.6 107.9,-30.2 107.9,-30.2 -28.9,-14.3 -82.9,-39.5 -94,-44.9 -9.7,-4.8 -25.3,-11.9 -28.7,-20.6 -3.8,-8.3 9,-15.5 16.2,-17.6 23.1,-6.7 55.8,-10.8 85.6,-11.3 14.9,-0.2 17.4,-1.2 17.4,-1.2 20.6,-3.4 34.2,-17.5 28.5,-39.9 -5.1,-22.8 -31.9,-36.2 -57.3,-31.6 -24,4.4 -81.7,21.2 -81.7,21.2 71.4,-0.6 83.4,0.6 88.7,8 3.2,4.4 -1.4,10.5 -20.5,13.6 -20.7,3.4 -63.8,7.5 -63.8,7.5 -41.3,2.5 -70.5,2.6 -79.2,21.1 -5.7,12.1 6.1,22.8 11.3,29.4 21.8,24.3 53.4,37.4 73.7,47 7.6,3.6 30.1,10.5 30.1,10.5 -65.9,-3.6 -113.4,16.6 -141.3,39.9 -31.5,29.2 -17.6,63.9 47,85.3 38.2,12.6 57.1,18.6 114,13.5 33.5,-1.8 38.8,-0.7 39.1,2 0.5,3.9 -37.2,13.5 -47.5,16.5 -26.2,7.6 -94.8,22.8 -95.2,22.9 z"/>

    <!-- Sparkle shapes -->
    <path id="sparkle4" d="M 0,-10 C 1,-3 3,-1 10,0 C 3,1 1,3 0,10 C -1,3 -3,1 -10,0 C -3,-1 -1,-3 0,-10 Z"/>
    <path id="claudeSpark" d="M 0,-12 C 2,-4 4,-2 12,0 C 4,2 2,4 0,12 C -2,4 -4,2 -12,0 C -4,-2 -2,-4 0,-12 Z"/>
  </defs>

  <!-- ============================================ -->
  <!-- MAIN ICON: tilted, warped, melting           -->
  <!-- ============================================ -->
  <g transform="rotate(3, 256, 256)">

    <!-- Shadow (original Emacs dark indigo) -->
    <ellipse cx="262" cy="268" rx="236" ry="236"
             style="fill:#211f46;opacity:0.45;filter:url(#shadowBlur)"/>

    <!-- ===== CAT EARS (warped) ===== -->
    <g filter="url(#circleWarp)">
      <!-- Left ear -->
      <path d="M 95,85 L 50,-40 L 180,48 Z" fill="url(#emacsCircle)" stroke="url(#emacsStroke)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 108,70 L 70,-20 L 168,48 Z" fill="url(#earInner)" opacity="0.7"/>
      <!-- Right ear -->
      <path d="M 415,85 L 460,-40 L 330,48 Z" fill="url(#emacsCircle)" stroke="url(#emacsStroke)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 402,70 L 440,-20 L 340,48 Z" fill="url(#earInner)" opacity="0.7"/>
    </g>

    <!-- ===== MAIN CIRCLE (warped) ===== -->
    <g filter="url(#circleWarp)">
      <ellipse cx="255" cy="256" rx="230" ry="230"
               style="fill:url(#emacsCircle);stroke:url(#emacsStroke);stroke-width:7"/>
    </g>

    <!-- ===== QUILL (warped, no chromatic aberration) ===== -->
    <use href="#quill" style="fill:#ffffff;fill-opacity:0.95" filter="url(#quillWarp)"/>

    <!-- Scanlines -->
    <g filter="url(#circleWarp)">
      <ellipse cx="255" cy="256" rx="230" ry="230"
               style="fill:url(#scanlines);opacity:0.18"/>
    </g>

    <!-- ===== UWU FACE (bold, black outline, thick) ===== -->
    <g filter="url(#meltWarp)">
      <!-- ^ ^ eyes - black outline layer -->
      <path d="M 180,315 L 197,288 L 214,315" stroke="#000" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <path d="M 296,315 L 313,288 L 330,315" stroke="#000" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <!-- ^ ^ eyes - white fill -->
      <path d="M 180,315 L 197,288 L 214,315" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 296,315 L 313,288 L 330,315" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- w mouth - black outline -->
      <path d="M 210,345 Q 235,368 255,345 Q 275,368 300,345" stroke="#000" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <!-- w mouth - white fill -->
      <path d="M 210,345 Q 235,368 255,345 Q 275,368 300,345" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Blush (warped, lavender, bigger) -->
    <g filter="url(#meltWarp)" opacity="0.35">
      <ellipse cx="162" cy="335" rx="22" ry="11" fill="#d3d2e8"/>
      <ellipse cx="348" cy="335" rx="22" ry="11" fill="#d3d2e8"/>
    </g>

    <!-- ===== MELTING DRIPS (Emacs purple tones) ===== -->
    <!-- Big center drip (dark purple) -->
    <path d="M 252,486 Q 250,500 251,525 Q 252,548 250,565 Q 249,575 251,580 Q 252,583 254,580"
          stroke="url(#dripDark)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Thick lavender drip left -->
    <path d="M 190,480 Q 188,495 189,518 Q 190,538 188,552 Q 187,560 189,558"
          stroke="url(#dripLavender)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Thick magenta drip right -->
    <path d="M 320,484 Q 322,498 321,522 Q 320,540 322,550"
          stroke="url(#dripMagenta)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.65"/>
    <!-- Purple drip far left -->
    <path d="M 130,455 Q 128,468 129,490 Q 130,505 128,515 Q 127,522 129,520"
          stroke="url(#dripPurple)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Lavender drip far right -->
    <path d="M 390,468 Q 392,480 391,505 Q 390,520 392,530"
          stroke="url(#dripLavender)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- Thin magenta drip -->
    <path d="M 160,472 Q 159,482 160,498 Q 161,508 159,515"
          stroke="url(#dripMagenta)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Thin dark drip -->
    <path d="M 355,482 Q 354,492 355,508"
          stroke="url(#dripDark)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.45"/>
    <!-- Edge drips -->
    <path d="M 85,418 Q 83,430 82,448 Q 81,456 83,462"
          stroke="url(#dripPurple)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M 420,440 Q 422,452 421,470 Q 420,480 422,488"
          stroke="url(#dripMagenta)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- Drip blobs -->
    <circle cx="251" cy="580" r="5" fill="#5b2a85" opacity="0.5"/>
    <circle cx="189" cy="558" r="4.5" fill="#bab8db" opacity="0.5"/>
    <circle cx="322" cy="550" r="4" fill="#a52ecb" opacity="0.45"/>
    <circle cx="129" cy="520" r="3.5" fill="#7e55b3" opacity="0.45"/>

    <!-- ===== GLITCH BARS (purple tones) ===== -->
    <rect x="40" y="175" width="420" height="4" fill="#a52ecb" opacity="0.14"/>
    <rect x="80" y="178" width="300" height="2" fill="#bab8db" opacity="0.18"/>
    <rect x="30" y="335" width="450" height="3" fill="#5b2a85" opacity="0.12"/>
    <rect x="60" y="337" width="350" height="1.5" fill="#8381c5" opacity="0.16"/>
    <rect x="20" y="115" width="220" height="2.5" fill="#7e55b3" opacity="0.1"/>
    <rect x="260" y="395" width="220" height="3" fill="#a52ecb" opacity="0.12"/>
  </g>

  <!-- ============================================ -->
  <!-- FLOATING DECORATIONS                         -->
  <!-- ============================================ -->

  <!-- ===== CLAUDE MASCOT ===== -->
  <g transform="translate(435, 10)">
    <circle cx="0" cy="0" r="34" fill="url(#claudeGrad)" stroke="#d4845a" stroke-width="2.5" filter="url(#softGlow)"/>
    <g transform="scale(2)" fill="#fff" opacity="0.9">
      <use href="#claudeSpark"/>
    </g>
    <text x="0" y="52" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="12" fill="#e8956a" text-anchor="middle" font-weight="bold" opacity="0.8">claude</text>
  </g>

  <!-- ===== CODEX LOGO (in muted purple) ===== -->
  <g transform="translate(35, 520)">
    <g stroke="#8381c5" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#sparkGlow)">
      <path d="M 0,-20 L 17.3,-10 L 17.3,10 L 0,20 L -17.3,10 L -17.3,-10 Z"/>
      <line x1="0" y1="-20" x2="0" y2="-7"/>
      <line x1="17.3" y1="-10" x2="6" y2="-3.5"/>
      <line x1="17.3" y1="10" x2="6" y2="3.5"/>
      <line x1="0" y1="20" x2="0" y2="7"/>
      <line x1="-17.3" y1="10" x2="-6" y2="3.5"/>
      <line x1="-17.3" y1="-10" x2="-6" y2="-3.5"/>
      <path d="M 0,-7 L 6,-3.5 L 6,3.5 L 0,7 L -6,3.5 L -6,-3.5 Z"/>
    </g>
    <text x="0" y="35" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="11" fill="#8381c5" text-anchor="middle" font-weight="bold" opacity="0.6">codex</text>
  </g>

  <!-- ===== SPARKLES (purple/lavender/white) ===== -->
  <g transform="translate(40, 18) scale(1.5)" fill="#a52ecb" filter="url(#sparkGlow)" opacity="0.7">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(510, 195) scale(1.2)" fill="#bab8db" filter="url(#sparkGlow)" opacity="0.6">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(490, 430) scale(1.0)" fill="#7e55b3" filter="url(#sparkGlow)" opacity="0.55">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(-15, 290) scale(0.9)" fill="#8381c5" filter="url(#sparkGlow)" opacity="0.55">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(395, 38) scale(0.7)" fill="#fff" filter="url(#sparkGlow)" opacity="0.6">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(10, 155) scale(0.8)" fill="#d3d2e8" filter="url(#sparkGlow)" opacity="0.45">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(355, -35) scale(0.9)" fill="#5b2a85" filter="url(#sparkGlow)" opacity="0.5">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(345, 555) scale(1.1)" fill="#a52ecb" filter="url(#sparkGlow)" opacity="0.4">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(105, 555) scale(0.8)" fill="#bab8db" filter="url(#sparkGlow)" opacity="0.35">
    <use href="#sparkle4"/>
  </g>
  <g transform="translate(520, 310) scale(0.6)" fill="#7e55b3" filter="url(#sparkGlow)" opacity="0.45">
    <use href="#sparkle4"/>
  </g>

  <!-- ===== FLOATING TEXT (purple tones) ===== -->
  <text x="500" y="345" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="22" fill="#bab8db" font-weight="bold" opacity="0.5" transform="rotate(-15, 500, 345)" filter="url(#sparkGlow)">uwu</text>
  <text x="-18" y="440" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="17" fill="#8381c5" font-weight="bold" opacity="0.4" transform="rotate(10, -18, 440)" filter="url(#sparkGlow)">nya~</text>
  <text x="455" y="125" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="16" fill="#a52ecb" font-weight="bold" opacity="0.4" transform="rotate(-8, 455, 125)">:3</text>
  <text x="15" y="75" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="13" fill="#5b2a85" font-weight="bold" opacity="0.4" transform="rotate(5, 15, 75)">slop</text>
  <text x="-25" y="175" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="11" fill="#7e55b3" font-weight="bold" opacity="0.3" transform="rotate(-3, -25, 175)">vibes</text>
  <text x="500" y="520" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="10" fill="#bab8db" font-weight="bold" opacity="0.3" transform="rotate(7, 500, 520)">lmao</text>

  <!-- ===== EMOJI DEBRIS ===== -->
  <text x="520" y="268" font-size="18" opacity="0.35" transform="rotate(12, 520, 268)">&#x1F496;</text>
  <text x="-25" y="215" font-size="15" opacity="0.3" transform="rotate(-8, -25, 215)">&#x2728;</text>
  <text x="480" y="490" font-size="16" opacity="0.3">&#x1F4AB;</text>
  <text x="95" y="-25" font-size="14" opacity="0.25">&#x2B50;</text>
  <text x="-10" y="530" font-size="16" opacity="0.25">&#x1F380;</text>
  <text x="200" y="-45" font-size="13" opacity="0.25" transform="rotate(5, 200, -45)">&#x1F525;</text>
  <text x="530" y="400" font-size="12" opacity="0.2">&#x1F640;</text>
  <!-- Melting face emojis -->
  <text x="-30" y="370" font-size="22" opacity="0.4" transform="rotate(-5, -30, 370)">&#x1FAE0;</text>
  <text x="515" y="150" font-size="19" opacity="0.35" transform="rotate(8, 515, 150)">&#x1FAE0;</text>
  <text x="460" y="550" font-size="16" opacity="0.3" transform="rotate(-10, 460, 550)">&#x1FAE0;</text>

</svg>
